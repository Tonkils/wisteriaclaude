<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wisteria — Cannabis Network</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --bg2: #111;
      --bg3: #171717;
      --border: #1f1f1f;
      --purple: #7c3aed;
      --purple-light: #c084fc;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --text: #f0f0f0;
      --muted: #666;
      --muted2: #888;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Zone 1: Control bar ── */
    .control-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #0f0f0f;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 48px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--muted);
    }
    .status-dot.running {
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(34,197,94,0.6);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
      70%  { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
    .current-account {
      flex: 1;
      font-size: 11px;
      color: var(--muted2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .current-account strong { color: var(--purple-light); }
    .control-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .btn {
      padding: 5px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .btn-start { background: var(--purple); color: #fff; }
    .btn-stop  { background: #7f1d1d; color: #fff; display: none; }
    .btn-settings {
      padding: 5px 8px;
      background: var(--bg3);
      border: 1px solid #2a2a2a;
      border-radius: 5px;
      color: var(--muted2);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }
    .btn-settings:hover { color: var(--purple-light); }

    /* ── Zone 2: Monitor strip ── */
    .monitor-strip {
      padding: 10px 14px 8px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .monitor-strip.collapsed { display: none; }
    .monitor-row1 { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .progress-ring-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
    .progress-ring-wrap svg { transform: rotate(-90deg); }
    .progress-ring-bg { fill: none; stroke: #222; stroke-width: 4; }
    .progress-ring-fill { fill: none; stroke: var(--purple); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.5s; }
    .progress-ring-label {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: var(--purple-light);
    }
    .stat-pills { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
    .stat-pill {
      display: flex; flex-direction: column; align-items: center;
      background: var(--bg3);
      border-radius: 6px;
      padding: 5px 10px;
      min-width: 54px;
    }
    .stat-pill .val { font-size: 15px; font-weight: 700; }
    .stat-pill .lbl { font-size: 9px; color: var(--muted2); margin-top: 1px; text-transform: uppercase; letter-spacing: 0.3px; }
    .pill-eval .val { color: var(--purple-light); }
    .pill-pending .val { color: var(--muted2); }
    .pill-errors .val { color: var(--red); }
    .monitor-row2 { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
    .sheets-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px; border-radius: 10px;
      font-size: 10px; font-weight: 600; cursor: default;
    }
    .sheets-pill.ok     { background: rgba(34,197,94,0.12); color: var(--green); }
    .sheets-pill.error  { background: rgba(239,68,68,0.12);  color: var(--red); }
    .sheets-pill.unknown{ background: rgba(100,100,100,0.12); color: var(--muted2); }

    /* ── Zone 3: Activity feed ── */
    .feed-section {
      display: flex; flex-direction: column;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      max-height: 170px;
    }
    .feed-section.collapsed { max-height: 28px; overflow: hidden; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 14px;
      cursor: pointer;
      user-select: none;
      font-size: 10px; font-weight: 600; color: var(--muted2);
      text-transform: uppercase; letter-spacing: 0.5px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .section-header:hover { color: var(--purple-light); }
    .section-header .chevron { font-size: 9px; transition: transform 0.15s; }
    .feed-section.collapsed .chevron { transform: rotate(-90deg); }
    .feed-scroll {
      overflow-y: auto;
      flex: 1;
      padding: 0 0 4px;
    }
    .feed-paused-btn {
      position: absolute; right: 14px; top: 2px;
      font-size: 9px; color: var(--purple); cursor: pointer;
      background: none; border: none; padding: 2px 4px;
    }
    .section-header-wrap { position: relative; }
    .feed-row {
      display: flex; align-items: baseline; gap: 6px;
      padding: 3px 14px;
      animation: slideIn 0.15s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .feed-row:hover { background: var(--bg2); }
    .feed-icon { font-size: 10px; flex-shrink: 0; width: 12px; }
    .feed-time { font-size: 9px; color: var(--muted); flex-shrink: 0; width: 36px; }
    .feed-user { color: var(--purple-light); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .feed-meta { font-size: 10px; color: var(--muted2); flex-shrink: 0; white-space: nowrap; }
    .feed-meta.err { color: var(--red); font-size: 9px; }

    /* ── Zone 4: Data tabs ── */
    .tabs-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tab-bar {
      display: flex; align-items: center;
      padding: 0 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 0;
    }
    .tab-bar-left { display: flex; flex: 1; }
    .tab-btn {
      padding: 8px 12px;
      border: none; border-bottom: 2px solid transparent;
      background: transparent; color: var(--muted2);
      cursor: pointer; font-size: 11px; font-weight: 600;
    }
    .tab-btn.active { color: var(--purple-light); border-bottom-color: var(--purple); }
    .tab-content { flex: 1; overflow: hidden; position: relative; }
    .tab-pane { display: none; height: 100%; }
    .tab-pane.active { display: flex; flex-direction: column; }

    /* Table */
    .table-filters {
      display: flex; gap: 6px; padding: 7px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; flex-wrap: wrap; align-items: center;
    }
    .table-filters input, .table-filters select {
      padding: 3px 6px;
      background: #1a1a1a; border: 1px solid #333;
      border-radius: 4px; color: var(--text); font-size: 10px;
    }
    .table-filters input { width: 72px; }
    .table-filters label { color: var(--muted); font-size: 10px; }
    .apply-btn {
      padding: 3px 9px; background: #4c1d95;
      border: none; border-radius: 4px; color: #fff;
      cursor: pointer; font-size: 10px; font-weight: 600;
    }
    .export-btn {
      margin-left: auto;
      padding: 3px 9px; background: #166534;
      border: none; border-radius: 4px; color: #fff;
      cursor: pointer; font-size: 10px;
    }
    .table-scroll { overflow-y: auto; flex: 1; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      position: sticky; top: 0; background: var(--bg2);
      padding: 6px 8px; text-align: left;
      font-size: 10px; color: var(--muted2); font-weight: 600;
      border-bottom: 1px solid var(--border);
      cursor: pointer; white-space: nowrap; user-select: none;
    }
    thead th:hover { color: var(--purple-light); }
    tbody tr { border-bottom: 1px solid #111; }
    tbody tr:hover { background: var(--bg2); }
    tbody td { padding: 5px 8px; vertical-align: middle; font-size: 11px; }
    .user-link { color: var(--purple-light); font-weight: 600; text-decoration: none; }
    .user-link:hover { text-decoration: underline; }
    .eng-high { color: var(--green); font-weight: 600; }
    .eng-med  { color: var(--amber); font-weight: 600; }
    .eng-low  { color: var(--red); font-weight: 600; }
    .loc-cell { color: var(--muted2); font-size: 10px; }
    .status-dot-sm { display: inline-block; width: 6px; height: 6px; border-radius: 50%; vertical-align: middle; }
    .empty-state { padding: 40px 20px; text-align: center; color: var(--muted); }

    /* Graph */
    #graphSvg { width: 100%; height: 100%; }
    .link { stroke: #2a2a2a; stroke-opacity: 0.6; }
    .link.geo-link { stroke: #4c1d95; stroke-dasharray: 3,2; stroke-opacity: 0.4; }
    .node circle, .node rect { stroke: var(--bg); stroke-width: 1.5; cursor: pointer; }
    .node text { font-size: 8px; fill: #aaa; pointer-events: none; }
    .tooltip {
      position: absolute; background: #15101f; border: 1px solid var(--purple);
      border-radius: 8px; padding: 9px 11px; font-size: 10px; pointer-events: none;
      max-width: 200px; line-height: 1.7; color: #ddd; display: none; z-index: 100;
    }
    .tooltip strong { color: var(--purple-light); font-size: 11px; display: block; margin-bottom: 3px; }
    .graph-legend {
      position: absolute; bottom: 10px; left: 10px;
      background: rgba(13,13,13,0.92); border: 1px solid #222;
      border-radius: 6px; padding: 7px 10px; font-size: 9px; color: var(--muted);
    }
    .legend-row { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
    .lg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .lg-rect { width: 9px; height: 9px; flex-shrink: 0; }

    /* Errors tab */
    .errors-scroll { overflow-y: auto; flex: 1; }
    .error-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-bottom: 1px solid #111;
    }
    .error-row:hover { background: var(--bg2); }
    .error-badge {
      font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .badge-rate_limited   { background: rgba(245,158,11,0.15); color: var(--amber); }
    .badge-private_account{ background: rgba(100,100,100,0.15); color: var(--muted2); }
    .badge-not_found      { background: rgba(100,100,100,0.15); color: var(--muted2); }
    .badge-network_error  { background: rgba(239,68,68,0.12);  color: var(--red); }
    .badge-no_data        { background: rgba(239,68,68,0.12);  color: var(--red); }
    .badge-sheets_sync    { background: rgba(124,58,237,0.12); color: var(--purple-light); }
    .badge-unknown        { background: rgba(100,100,100,0.15); color: var(--muted2); }
    .error-user { color: var(--purple-light); font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .error-time { font-size: 9px; color: var(--muted); flex-shrink: 0; }
    .retry-btn {
      padding: 3px 8px; background: #3b1d6e;
      border: none; border-radius: 4px; color: #c084fc;
      cursor: pointer; font-size: 10px; font-weight: 600; flex-shrink: 0;
    }
    .retry-btn:hover { background: var(--purple); }

    /* Settings drawer */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 200; display: none;
    }
    .drawer-overlay.open { display: block; }
    .settings-drawer {
      position: fixed; right: 0; top: 0; bottom: 0; width: 240px;
      background: #111; border-left: 1px solid #2a2a2a;
      z-index: 201; transform: translateX(100%);
      transition: transform 0.2s ease; display: flex; flex-direction: column;
    }
    .settings-drawer.open { transform: translateX(0); }
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .drawer-header h2 { font-size: 13px; color: var(--purple-light); font-weight: 700; }
    .drawer-close { background: none; border: none; color: var(--muted2); cursor: pointer; font-size: 16px; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
    .drawer-section { margin-bottom: 18px; }
    .drawer-section label { display: block; font-size: 10px; color: var(--muted2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.3px; }
    .drawer-section input[type=range] { width: 100%; accent-color: var(--purple); }
    .drawer-section input[type=number] {
      width: 100%; padding: 5px 8px;
      background: #1a1a1a; border: 1px solid #333;
      border-radius: 4px; color: var(--text); font-size: 12px;
    }
    .range-val { font-size: 11px; color: var(--purple-light); float: right; margin-top: -4px; }
    .drawer-save {
      margin: 0 16px 16px;
      width: calc(100% - 32px);
      padding: 9px; background: var(--purple);
      border: none; border-radius: 6px; color: #fff;
      cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .danger-btn {
      width: 100%; padding: 7px;
      background: #1a0808; border: 1px solid #7f1d1d;
      border-radius: 5px; color: #f87171;
      cursor: pointer; font-size: 11px; font-weight: 600; margin-top: 8px;
    }
    .key-section { padding: 10px 16px; border-top: 1px solid var(--border); }
    .key-section label { font-size: 10px; color: var(--muted2); }
    .key-email { font-size: 10px; color: var(--green); margin-top: 3px; }
    .key-none  { font-size: 10px; color: var(--muted); margin-top: 3px; }
    textarea.key-ta {
      width: 100%; height: 56px; margin-top: 6px;
      padding: 5px 7px; background: #1a1a1a;
      border: 1px solid #333; border-radius: 4px;
      color: var(--text); font-size: 9px; font-family: monospace; resize: vertical;
    }
    .key-save-btn {
      width: 100%; margin-top: 6px; padding: 6px;
      background: #1a3020; border: 1px solid #166534;
      border-radius: 4px; color: #4ade80;
      cursor: pointer; font-size: 11px; font-weight: 600;
    }

    /* Stats summary bar */
    .stat-bar {
      display: flex; gap: 14px; padding: 5px 14px;
      background: #080808; border-bottom: 1px solid #111;
      font-size: 10px; color: var(--muted); flex-shrink: 0; flex-wrap: wrap;
    }
    .stat-bar strong { color: var(--purple-light); }
  </style>
</head>
<body>

  <!-- Zone 1: Control bar -->
  <div class="control-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="current-account" id="currentAccount">Stopped</div>
    <div class="control-btns">
      <button class="btn btn-start" id="btnStart">▶ Start</button>
      <button class="btn btn-stop"  id="btnStop">⏹ Stop</button>
      <button class="btn-settings" id="btnSettings" title="Settings">⚙</button>
    </div>
  </div>

  <!-- Zone 2: Monitor strip -->
  <div class="monitor-strip" id="monitorStrip">
    <div class="monitor-row1">
      <div class="progress-ring-wrap">
        <svg width="48" height="48" viewBox="0 0 48 48">
          <circle class="progress-ring-bg" cx="24" cy="24" r="20"/>
          <circle class="progress-ring-fill" id="progressRingFill" cx="24" cy="24" r="20"
            stroke-dasharray="125.66" stroke-dashoffset="125.66"/>
        </svg>
        <div class="progress-ring-label" id="progressRingLabel">0%</div>
      </div>
      <div class="stat-pills">
        <div class="stat-pill pill-eval">
          <span class="val" id="statEval">0</span>
          <span class="lbl">Done</span>
        </div>
        <div class="stat-pill pill-pending">
          <span class="val" id="statPending">—</span>
          <span class="lbl">Pending</span>
        </div>
        <div class="stat-pill pill-errors">
          <span class="val" id="statErrors">0</span>
          <span class="lbl">Errors</span>
        </div>
      </div>
    </div>
    <div class="monitor-row2">
      <span id="speedEta">—</span>
      <span id="sheetsHealthPill" class="sheets-pill unknown">☁ Sheets</span>
    </div>
  </div>

  <!-- Zone 3: Activity feed -->
  <div class="feed-section" id="feedSection">
    <div class="section-header-wrap">
      <div class="section-header" id="feedToggle">
        Activity feed
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="feed-scroll" id="feedScroll">
      <div id="feedRows"></div>
    </div>
  </div>

  <!-- Zone 4: Tabs -->
  <div class="tabs-area">
    <div class="tab-bar">
      <div class="tab-bar-left">
        <button class="tab-btn active" data-tab="table">Table</button>
        <button class="tab-btn" data-tab="graph">Graph</button>
        <button class="tab-btn" data-tab="errors" id="errorsTabBtn">Errors</button>
      </div>
    </div>

    <div class="tab-content">
      <!-- Table -->
      <div class="tab-pane active" id="pane-table">
        <div class="table-filters">
          <label>Followers ≥</label>
          <input type="number" id="fFollowers" value="0" placeholder="0">
          <label>Eng% ≥</label>
          <input type="number" id="fEng" value="0" step="0.1" placeholder="0" style="width:50px">
          <label>State</label>
          <input type="text" id="fState" placeholder="MD" style="width:40px">
          <label>Sort</label>
          <select id="fSort">
            <option value="followers">Followers</option>
            <option value="engagement_rate">Engagement</option>
            <option value="avg_video_views">Views</option>
            <option value="avg_likes">Likes</option>
          </select>
          <button class="apply-btn" id="btnFilter">Apply</button>
          <button class="export-btn" id="btnExport">CSV</button>
        </div>
        <div class="stat-bar" id="statBar">Loading…</div>
        <div class="table-scroll">
          <div class="empty-state" id="emptyState">No accounts evaluated yet.<br>Start evaluation to collect data.</div>
          <table id="dataTable" style="display:none">
            <thead>
              <tr>
                <th>Username</th>
                <th>Followers</th>
                <th>Eng%</th>
                <th>Views</th>
                <th>Likes</th>
                <th>Location</th>
                <th>Email</th>
                <th>Verified</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Graph -->
      <div class="tab-pane" id="pane-graph">
        <svg id="graphSvg"></svg>
        <div class="tooltip" id="tooltip"></div>
        <div class="graph-legend">
          <div class="legend-row"><div class="lg-dot" style="background:#22c55e"></div> High engagement (≥3%)</div>
          <div class="legend-row"><div class="lg-dot" style="background:#f59e0b"></div> Med (1–3%)</div>
          <div class="legend-row"><div class="lg-dot" style="background:#ef4444"></div> Low (&lt;1%)</div>
          <div class="legend-row"><div class="lg-rect" style="background:#7c3aed"></div> Location</div>
        </div>
      </div>

      <!-- Errors -->
      <div class="tab-pane" id="pane-errors">
        <div class="errors-scroll">
          <div class="empty-state" id="errorsEmpty">No errors recorded.</div>
          <div id="errorRows"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="settings-drawer" id="settingsDrawer">
    <div class="drawer-header">
      <h2>Settings</h2>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-body">
      <div class="drawer-section">
        <label>Min delay between accounts</label>
        <input type="range" id="settMinDelay" min="5" max="60" value="10">
        <span class="range-val" id="settMinDelayVal">10s</span>
      </div>
      <div class="drawer-section">
        <label>Max delay between accounts</label>
        <input type="range" id="settMaxDelay" min="10" max="120" value="20">
        <span class="range-val" id="settMaxDelayVal">20s</span>
      </div>
      <div class="drawer-section">
        <label>Session cap (accounts)</label>
        <input type="number" id="settSessionCap" value="200" min="10" max="500">
      </div>
      <div class="drawer-section">
        <label>Daily cap (accounts)</label>
        <input type="number" id="settDailyCap" value="400" min="50" max="1000">
      </div>
      <div class="drawer-section">
        <label>Jitter pause every N accounts</label>
        <input type="number" id="settJitterEvery" value="10" min="5" max="50">
      </div>
      <div class="drawer-section">
        <button class="danger-btn" id="btnResetQueue">Reset all data &amp; queue</button>
      </div>
    </div>
    <button class="drawer-save" id="btnSaveSettings">Save settings</button>
    <div class="key-section">
      <label>Service account</label>
      <div class="key-email" id="drawerKeyEmail" style="display:none"></div>
      <div class="key-none"  id="drawerKeyNone">No key saved</div>
      <textarea class="key-ta" id="drawerKeyInput" placeholder="Paste JSON key to replace…"></textarea>
      <button class="key-save-btn" id="drawerKeySave">Save key</button>
    </div>
  </div>

  <script src="../lib/d3.v7.min.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
