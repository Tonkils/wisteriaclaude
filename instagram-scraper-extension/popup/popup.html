<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 260px;
      background: #0d0d0d;
      color: #f0f0f0;
      font-size: 12px;
    }
    .header {
      background: linear-gradient(135deg, #2d1b69, #1a0a3a);
      padding: 12px 14px 10px;
      border-bottom: 1px solid #3a2060;
      display: flex; align-items: center; gap: 8px;
    }
    .header h1 { font-size: 13px; font-weight: 700; color: #c084fc; flex: 1; }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #555;
      flex-shrink: 0;
    }
    .status-dot.running {
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34,197,94,0.6);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
      70%  { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
    .status-text { font-size: 10px; color: #888; }
    .section { padding: 12px 14px; border-bottom: 1px solid #1a1a1a; }
    .btn {
      width: 100%; padding: 9px 12px;
      border: none; border-radius: 6px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      margin-bottom: 6px; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:last-child { margin-bottom: 0; }
    .btn-open   { background: #7c3aed; color: #fff; }
    .btn-start  { background: #166534; color: #fff; }
    .btn-stop   { background: #7f1d1d; color: #fff; display: none; }
    .key-toggle {
      width: 100%; text-align: left;
      background: none; border: none;
      color: #888; font-size: 10px; cursor: pointer; padding: 0;
      display: flex; align-items: center; gap: 4px;
    }
    .key-toggle:hover { color: #c084fc; }
    .key-body { margin-top: 8px; display: none; }
    .key-body.open { display: block; }
    textarea.key-input {
      width: 100%; height: 56px;
      padding: 5px 7px; background: #1a1a1a;
      border: 1px solid #333; border-radius: 5px;
      color: #f0f0f0; font-size: 9px; font-family: monospace; resize: vertical;
      margin-bottom: 5px;
    }
    textarea.key-input::placeholder { color: #444; }
    .btn-save-key {
      width: 100%; padding: 6px;
      background: #1a3020; border: 1px solid #166534;
      border-radius: 4px; color: #4ade80;
      cursor: pointer; font-size: 10px; font-weight: 600;
    }
    .key-status { font-size: 10px; color: #888; margin-top: 4px; }
    .key-ok { color: #22c55e; }
  </style>
</head>
<body>
  <div class="header">
    <div class="status-dot" id="statusDot"></div>
    <h1>Wisteria Scraper</h1>
    <span class="status-text" id="statusText">—</span>
  </div>

  <div class="section">
    <button class="btn btn-open" id="btnOpen">Open Dashboard →</button>
    <button class="btn btn-start" id="btnStart">▶ Start Evaluation</button>
    <button class="btn btn-stop"  id="btnStop">⏹ Stop</button>
  </div>

  <div class="section" style="border:none">
    <button class="key-toggle" id="keyToggle">⚙ Service account key <span id="keyChevron">▾</span></button>
    <div class="key-body" id="keyBody">
      <div class="key-status" id="keyStatus">No key saved</div>
      <textarea class="key-input" id="keyInput" placeholder="Paste JSON key here…"></textarea>
      <button class="btn-save-key" id="btnSaveKey">Save key</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
